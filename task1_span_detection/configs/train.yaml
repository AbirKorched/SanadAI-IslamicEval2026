defaults:
  - data: islamiceval_task1_augmented

seed: 42

model:
  name: "NAMAA-Space/AraModernBert-Base-V1.0"

max_length: 1024 # To avoid memory overflow when experimenting locally

training:

  output_dir: "outputs/ner_AraModernBert"

  epochs: 15

  learning_rate: 1e-5

  weight_decay: 0.03

  warmup_ratio: 0.05

  train_batch_size: 2

  eval_batch_size: 4

  gradient_accumulation_steps: 16

  max_grad_norm: 1.0

  fp16: true

  eval_strategy: "epoch"

  save_strategy: "epoch"

  logging_steps: 50

  load_best_model_at_end: true

  metric_for_best_model: "f1"

loss:

  name: "weighted_ce"
